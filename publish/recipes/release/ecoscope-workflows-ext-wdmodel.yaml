context:
  name: ecoscope-workflows-ext-wdmodel
  version: ${{ env.get("HATCH_VCS_VERSION", default="0.0.1") }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ../../..

build:
  noarch: python
  script: SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }} python -m pip install src/ecoscope-workflows-ext-wdmodel -vv --no-deps
  number: 0

requirements:
  # hatch-vcs is load-bearing, not optional. pyproject declares
  # dynamic = ["version"] with a vcs source, so hatchling cannot produce
  # metadata without it. pip would try to fetch it into an isolated build
  # env, which fails in the sandbox and surfaces only as "metadata
  # generation failed" at the bottom of a long pip traceback.
  host: [python, hatchling, hatch-vcs, pip]
  run:
    - python
    - wt-registry
    - ecoscope-platform
    - pandas

about:
  license: BSD-3-Clause

extra:
  recipe-maintainers:
    - Rodney
