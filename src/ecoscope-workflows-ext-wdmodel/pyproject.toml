[project]
name = "ecoscope-workflows-ext-wdmodel"
# Static, like ermigrate's. A tag-derived version needs a repo with at least one
# tag; this one has none yet, and a static value means the package builds and the
# workflow compiles from a bare checkout. spec.yaml resolves it with "*" from the
# local channel, so the value only matters for cache busting on a rebuild.
version = "0.0.1"
requires-python = ">=3.10"
description = "Tasks for provisioning the WD standard data model onto an EarthRanger instance."
readme = "README.md"
license = { text = "BSD-3-Clause" }
dependencies = ["wt-registry", "pandas"]

[project.entry-points."wt_registry"]
tasks = "ecoscope_workflows_ext_wdmodel.tasks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecoscope_workflows_ext_wdmodel"]
# The model ships inside the wheel. It is the same standard model for every
# organisation, so a site supplies nothing -- which is what lets one run set up a
# brand new instance with no reference instance reachable.
only-packages = false
artifacts = ["ecoscope_workflows_ext_wdmodel/data/*.json"]

[tool.hatch.build.targets.sdist]
include = ["ecoscope_workflows_ext_wdmodel"]
artifacts = ["ecoscope_workflows_ext_wdmodel/data/*.json"]
