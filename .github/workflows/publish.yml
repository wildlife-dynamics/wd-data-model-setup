name: Publish

# Runs on the tag that tag.yml cuts when a PR to main merges.
#
# This file's NAME matters: the prefix.dev trusted publisher is registered
# against the repository and this workflow filename, so the upload has to
# happen from here. Renaming it, or publishing from another workflow, fails
# with "Failed to find OIDC publisher".
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  # Retry button: pick the tag as the ref when an upload needs rerunning.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    uses: ./.github/workflows/_build.yml

  publish-to-prefix:
    needs:
      - build-release
    runs-on: ubuntu-latest
    permissions:
      # A job-level `permissions:` block replaces the whole set, so contents
      # has to be restated or actions/checkout fails on a private repository
      # with "repository not found".
      contents: read
      # Trusted publishing. The channel authenticates this repository through
      # the OIDC token, so there is no API key to hold or rotate -- which is
      # why nothing here reads a secret.
      id-token: write
    steps:
      - name: Download conda channel
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: /tmp/ecoscope-workflows-custom/release/artifacts

      - name: Log conda channel contents
        run: ls -lR /tmp/ecoscope-workflows-custom/release/artifacts

      - uses: actions/checkout@v6

      - name: Install pixi
        run: curl -fsSL https://pixi.sh/install.sh | bash && echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install rattler-build
        run: pixi global install rattler-build

      - name: Publish to prefix.dev
        run: bash ./publish/push.sh
