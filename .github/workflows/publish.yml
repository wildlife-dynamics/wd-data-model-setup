name: Publish

# Manual only. The automatic path lives in tag.yml, which builds and
# publishes in the same run that cuts the tag -- see the comment there.
#
# Deliberately NOT `on: push: tags`. With tag.yml publishing inline, a tag
# trigger here would mean two uploads of the same version, and the second
# fails on a duplicate. This is the retry button: pick the tag as the ref
# when a release needs republishing, or when a tag was pushed by hand.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    uses: ./.github/workflows/_build.yml

  publish-to-prefix:
    needs:
      - build-release
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing. The channel authenticates this repository through
      # the OIDC token, so there is no API key to hold or rotate -- which is
      # why nothing here reads a secret.
      id-token: write
    steps:
      - name: Download conda channel
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: /tmp/ecoscope-workflows-custom/release/artifacts

      - name: Log conda channel contents
        run: ls -lR /tmp/ecoscope-workflows-custom/release/artifacts

      - uses: actions/checkout@v6

      - name: Install pixi
        run: curl -fsSL https://pixi.sh/install.sh | bash && echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install rattler-build
        run: pixi global install rattler-build

      - name: Publish to prefix.dev
        run: bash ./publish/push.sh
