name: Tag

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches:
      - 'main'
      - 'patch-*'

jobs:
  generate-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create_tag.outputs.result }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: List existing tags
        run: git tag -l
      - name: Find release directory
        id: find_release_dir
        run: |
          shopt -s nullglob
          dirs=(*-workflow/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "Error: no *-workflow directory found" >&2; exit 1
          elif [ ${#dirs[@]} -gt 1 ]; then
            echo "Error: multiple *-workflow directories found: ${dirs[*]}" >&2; exit 1
          fi
          echo "name=${dirs[0]%/}" >> $GITHUB_OUTPUT
      - name: Create tag from VERSION.yaml
        id: create_tag
        uses: mikefarah/yq@v4
        with:
          cmd: yq -r '"v" + (.MAJ | tostring) + "." + (.MIN | tostring) + "." + (.PATCH | tostring)' ${{ steps.find_release_dir.outputs.name }}/VERSION.yaml
      - name: Validate tag doesn't already exist
        run: |
          if git tag -l | grep -q "${{ steps.create_tag.outputs.result }}"; then
            echo "Tag ${{ steps.create_tag.outputs.result }} already exists. Exiting."
            exit 1
          else
            echo "Tag ${{ steps.create_tag.outputs.result }} does not exist. Proceeding."
          fi
      - name: Validate tag contains all three semantic elements
        run: |
          if [[ "${{ steps.create_tag.outputs.result }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${{ steps.create_tag.outputs.result }} is valid, because it adheres to vMAJ.MIN.PATCH format."
          else
            echo "Tag ${{ steps.create_tag.outputs.result }} is not valid. It must adhere to vMAJ.MIN.PATCH format."
            exit 1
          fi
      - name: If this is a PR to a patch branch, ensure the patch version is not 0
        if: startsWith(github.base_ref, 'patch-')
        run: |
          patch_version=$(echo "${{ steps.create_tag.outputs.result }}" | cut -d '.' -f 3)
          if [ "$patch_version" -ne 0 ]; then
            echo "Patch version is not 0. This is an acceptable PR to a patch branch."
          else
            echo "Patch version is 0. Please ensure that the patch version is incremented before merging this PR."
            exit 1
          fi

  cut-release:
    needs: generate-tag
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: List existing tags
        run: git tag -l
      - name: Tag
        run: |
          echo "Tagging version ${{ needs.generate-tag.outputs.tag }}"
          echo "Tagging from:\n$(git log -1)"
          git tag ${{ needs.generate-tag.outputs.tag }}
          git tag -l
      - name: Push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin --tags
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          '${{ needs.generate-tag.outputs.tag }}'
          --repo '${{ github.repository }}'
          --generate-notes

  # Publishing happens HERE, in the same workflow run that cut the tag, and
  # not by letting publish.yml react to the tag push.
  #
  # GitHub does not start new workflow runs from events raised by the default
  # GITHUB_TOKEN -- the guard against a workflow triggering itself forever.
  # cut-release pushes its tag with that token, so publish.yml never fires and
  # the release sits there with no package behind it. Staying inside one run
  # sidesteps that without putting a long-lived PAT in the repository.
  #
  # publish.yml is still there for a tag pushed by hand, and for re-running a
  # release whose upload failed.
  build-release:
    needs: cut-release
    uses: ./.github/workflows/_build.yml
    with:
      # The merge commit, not the pull_request event's synthetic
      # refs/pull/N/merge -- the new tag points at the former, and the
      # version is read from the tag.
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  publish-to-prefix:
    needs:
      - build-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download conda channel
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: /tmp/ecoscope-workflows-custom/release/artifacts

      - name: Log conda channel contents
        run: ls -lR /tmp/ecoscope-workflows-custom/release/artifacts

      - uses: actions/checkout@v6

      - name: Install pixi
        run: curl -fsSL https://pixi.sh/install.sh | bash && echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install rattler-build
        run: pixi global install rattler-build

      - name: Publish to prefix.dev
        run: bash ./publish/push.sh
