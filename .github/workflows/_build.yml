name: Build Release

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit to build. Leave empty for the triggering ref. tag.yml passes
          the merge commit, because a pull_request event checks out a
          synthetic refs/pull/N/merge commit that the new tag does not point
          at -- and the version is read from the tag.
        type: string
        required: false
        default: ""

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # full history AND tags; the version comes from the tag

      - name: Install pixi
        run: curl -fsSL https://pixi.sh/install.sh | bash && echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install build tools
        run: pixi global install rattler-build hatch hatch-vcs pip

      - name: Build release
        run: bash ./publish/build.sh

      - name: Upload conda channel
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            /tmp/ecoscope-workflows-custom/release/artifacts/
            !/tmp/ecoscope-workflows-custom/release/artifacts/bld
            !/tmp/ecoscope-workflows-custom/release/artifacts/src_cache
          if-no-files-found: error
          compression-level: 0
