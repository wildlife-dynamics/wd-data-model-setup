id: wd_data_model_setup

requirements:
  - name: ecoscope-platform
    version: ">=2.21.0, <2.22.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-wdmodel
    version: "*"
    channel: file:///tmp/ecoscope-workflows-custom/release/artifacts/

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

rjsf-overrides:
  # No EarthRangerEnumResolver anywhere. It was on the copy branch's event
  # type field, to fill it from the source instance, and it cannot work while
  # the source connection lives inside the Union branch. Three
  # experiments, one variable each:
  #
  #   depends_on                                      form builds   list loads
  #   $defs.CopyFromInstance...source.properties.name     yes          NO
  #   properties.setup...what.properties.source...name    NO            -
  #   properties.er_target...data_source.properties.name  yes          yes
  #
  # Row 1 resolves -- the alias is right and the form builds -- and the
  # lookup still fails with a connection error. Row 2 does not resolve at
  # all: the properties-rooted alias does not exist on a node inside an
  # anyOf, only the $defs-rooted one does. Row 3 is the same resolver on the
  # same field inside the same branch, reading a TOP-LEVEL connection, and it
  # works. So a resolver field inside a Union branch is fine; a CONNECTION
  # inside one cannot feed a source-options lookup.
  #
  # That makes the hidden source picker and the event-type dropdown mutually
  # exclusive, and the hidden picker won: copying is the rarer path and is
  # always deliberate, while every single run pays for a connection field it
  # does not use.
  #
  # The copy branch therefore selects CATEGORIES, typed. Selecting types was
  # only ever to suit the resolver -- it could list an instance's types and
  # not its categories -- and with nothing to list, a category is two or
  # three values rather than twenty-seven. types_in() answers a typo with the
  # near misses.

  properties:
    # The stock copy ("Select one of your configured data sources") assumes you
    # know a data source is a saved EarthRanger connection. Say which instance
    # and say that it is the one being written to, since this is the only field
    # that decides that.
    er_target.properties.data_source.title: "EarthRanger instance to set up"
    er_target.properties.data_source.description: >-
      The instance being written to, chosen from the connections saved under
      Data Sources. The same credentials read and write -- there is no second
      login.

    # The source connection is a field of the CopyFromInstance branch, so a
    # standard run does not render it at all. Five earlier attempts did not
    # get there:
    #
    #  1. a second set_er_connection task -- Desktop collects connection TASKS
    #                                        in their own wizard step and
    #                                        demands a selection every run.
    #  2. er_source.required: []        -- asterisk stayed. It comes from the
    #                                      shared $defs/EarthRangerConnection,
    #                                      where `name` is required.
    #  3. default: {"name": ""}         -- satisfies that `required`, and the
    #                                      form still refused to submit.
    #  4. an RJSF `dependencies` toggle -- hid the field and broke three other
    #                                      things, including the resolver.
    #  5. a top-level task parameter    -- rendered, was discovered, and was
    #                                      not required -- but showed on every
    #                                      run, which is what this replaces.
    #
    # The generated metadata.get_data_connection_property_names() walks two
    # levels of params.json and so cannot see a $ref inside $defs. That is
    # not what registers the picker: Desktop's form layer runs its own scan
    # that recurses through $ref, properties, items and anyOf/oneOf. Verified
    # by reading the app bundle, and confirmed by the picker rendering.
    #
    # depends_on below is matched against a node's alias set, and $defs-rooted
    # aliases are explicitly supported (with a referenceScopes check that both
    # ends belong to the same instantiation of the branch). The form builds
    # without complaint, so the alias resolves.
    #
    # OPEN: the picker still fails with "Options could not load because of a
    # connection problem", with a valid source selected and with any source.
    # That message is the generic rendering of several outcomes (network,
    # timeout, permission_denied, source_unavailable, reconnect_required,
    # invalid_response), so it does not by itself mean the instance is
    # unreachable. The separate source-options lookup carries an OPTIONAL
    # branchSelections array naming the live anyOf branch; whether a lookup
    # can follow a sourcePath through a Union branch is the thing to confirm.
    # If it cannot, the hidden connection and the picker cannot both be had.

    "Set up.properties.setup.title": " "
    # A multi-select array takes a large subhead-style label keyed only on
    # uniqueItems, with no uiSchema escape hatch -- a single space is how you
    # suppress it. An empty string would fall back to the raw property name.
    "Set up.properties.setup.properties.dry_run.title": "Dry run - create nothing"
    "Set up.properties.setup.properties.dry_run.default": true
    "Set up.properties.setup.properties.activate.title": "Activate the event types immediately"
    "Set up.properties.setup.properties.activate.default": false
    "Set up.properties.setup.properties.prefix.title": "Event type prefix (blank for a real build)"
    "Set up.properties.setup.properties.replace_schema.title": "Replace schemas that already exist"

workflow:
  # ---------------------------------------------------------------- config ---
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Group Data
    id: groupers
    # Bound empty: nothing here is grouped, so a grouper field on the form is a
    # question the user cannot usefully answer.
    task: set_groupers
    partial:
      groupers: []

  # ------------------------------------------------------------ connections ---
  # Both at the top level rather than inside a task-group card. The resolver's
  # depends_on walks the schema, and a top-level task is what gives it the
  # stable path.
  - name: Instance to set up
    id: er_target
    task: set_er_connection

  # --------------------------------------------------------------- set up ---
  - title: Set up
    type: task-group
    description: >-
      Start with "What this run should do". It decides which of the fields
      below are read - the standard-model fields, or the copy fields - and
      the others are ignored outright. Leave Dry run on
      first and read the table: it lists every intended write without making
      any, and flags any choice list that already exists on the instance with
      different options.
    tasks:
      # Dotted, not bare. A bare name has to be in the core task registry;
      # anything from an extension package is referenced by its importable
      # path, which is what the compiler means by "must be a dotted string".
      #
      # One task, not a plan task and an apply task. Dry run IS the plan, and
      # two tasks would put every field on the form twice.
      - name: Set up the data model
        id: setup
        task: ecoscope_workflows_ext_wdmodel.tasks.setup.apply_data_model
        partial:
          client: ${{ workflow.er_target.return }}

  # --------------------------------------------------------------- results ---
  # draw_* tasks return HTML; the widget tasks want a persisted file URL.
  # Passing a DataFrame straight to a widget fails with "Input is not a valid
  # path", so a table goes draw_table -> persist_text -> create_table_widget.
  - name: Results Table
    id: results_table
    task: draw_table
    partial:
      dataframe: ${{ workflow.setup.return }}
      widget_id: "Data model setup"
      columns: null
      table_config: null

  - name: Persist Results Table
    id: results_table_html
    task: persist_text
    partial:
      text: ${{ workflow.results_table.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename: setup.html

  - name: Results Widget
    id: results_widget
    task: create_table_widget_single_view
    partial:
      title: "Data model setup"
      data: ${{ workflow.results_table_html.return }}

  - name: Dashboard
    id: dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.results_widget.return }}
      groupers: ${{ workflow.groupers.return }}
      # Bound null so it leaves the form. gather_dashboard declares
      # `time_range: TimeRange | SkipJsonSchema[None] = None`, and
      # SkipJsonSchema strips the null branch from the schema -- so an unbound
      # time_range renders as a full Since/Until/TimezoneInfo card even though
      # the task does not need one. There is nothing time-filtered here: the
      # workflow reads an instance's current configuration, which has no dates.
      time_range: null
